name: download

on:
  workflow_dispatch:
  schedule:
    - cron: '00 7,19 * * *'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: python ./app/run.py "${{ secrets.telegram_token }}" "${{ secrets.chat_id }}"
      - uses: ./.github/actions/push
        with:
          message: "chore(publications): updated"
